name: mercado-nube

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: mercado-nube/airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:${AIRFLOW_HOST_PORT}
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "10"
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "False"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__WEBSERVER__INSTANCE_NAME: Mercado Nube Local
    PYTHONPATH: /opt/airflow
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: ${WAREHOUSE_DB}
    WAREHOUSE_USER: mn_app
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
    S3_ENDPOINT_URL: http://moto:5000
    S3_ACCESS_KEY: test
    S3_SECRET_KEY: test
    S3_BUCKET: ${S3_BUCKET}
    S3_REGION: ${S3_REGION}
    CATALOG_BASE_URL: http://api:8000
    REPORTING_CURRENCY: ${REPORTING_CURRENCY}
    QUALITY_MAX_REJECTION_RATE: ${QUALITY_MAX_REJECTION_RATE}
    QUALITY_MAX_DUPLICATE_RATE: ${QUALITY_MAX_DUPLICATE_RATE}
    QUALITY_MAX_UNKNOWN_RATE: ${QUALITY_MAX_UNKNOWN_RATE:-0.05}
    QUALITY_FRESHNESS_HOURS: ${QUALITY_FRESHNESS_HOURS}
    PIPELINE_RETRIES: ${PIPELINE_RETRIES:-2}
    PIPELINE_RETRY_DELAY_SECONDS: ${PIPELINE_RETRY_DELAY_SECONDS:-30}
    PIPELINE_MAX_RETRY_DELAY_MINUTES: ${PIPELINE_MAX_RETRY_DELAY_MINUTES:-10}
    DAILY_SCHEDULE: ${DAILY_SCHEDULE:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./scripts:/opt/airflow/scripts
    - ./tests:/opt/airflow/tests
    - ./docker/airflow/start.sh:/opt/airflow/start.sh:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    moto:
      condition: service_started
    api:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: mn_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  moto:
    image: motoserver/moto:latest
    container_name: mn_moto
    command: ["-H", "0.0.0.0", "-p", "5000"]
    ports:
      - "${S3_API_HOST_PORT:-9002}:5000"
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: mercado-nube/api:local
    container_name: mn_api
    environment:
      CATALOG_DIR: /data/catalog
      RATE_LIMIT_MAX_REQUESTS: "30"
      RATE_LIMIT_WINDOW_SECONDS: "10"
      TRANSIENT_ERROR_EVERY: "17"
    volumes:
      - ./api:/app
      - ./data/catalog:/data/catalog:ro
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  airflow:
    <<: *airflow-common
    container_name: mn_airflow
    entrypoint: ["/bin/bash", "/opt/airflow/start.sh"]
    ports:
      - "${AIRFLOW_HOST_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: mn_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_HOST_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: mercado-nube-postgres-data
  airflow_logs:
    name: mercado-nube-airflow-logs

